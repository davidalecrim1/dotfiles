set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'
bind-key -n S-Enter send-keys Escape "\[13;2u"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

set -g mouse on
set-window-option -g mode-keys vi

# Scroll enters copy mode instead of passing through to iTerm
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

set-option -g main-pane-width 50%
setw -g main-pane-height 50%

# --- Pane navigation (via vim-tmux-navigator) ---
# prefix h/j/k/l — navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing (repeatable) ---
# prefix H/J/K/L — resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Splits ---
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane management ---
bind z resize-pane -Z          # zoom/fullscreen toggle
bind x kill-pane               # kill pane (overrides default confirm-kill)
unbind !
bind b break-pane              # break pane into its own window

# --- Session management ---
bind q detach-client           # quick detach
bind i join-pane -s !          # pull last pane into this window

# --- Utilities ---
unbind g
unbind e
unbind r
bind '`' source-file ~/.tmux.conf \; display "Config reloaded"

# Alt (Option on macOS) + number — switch to window by number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt-k — clear screen and scrollback (like Cmd-k)
bind -n M-k send-keys C-l \; run-shell "sleep 0.1" \; clear-history

# --- Copy mode ---
bind [ copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- Scrolling ---
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

# --- Session ---
bind M-c attach-session -c "#{pane_current_path}"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'  # fuzzy session switcher (prefix o)

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# sessionx config
set -g @sessionx-bind 'o'

# tokyo-night theme widgets
set -g @powerkit_plugins "cpu,gpu,memory,network,disk,iops,fan"
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
set -g status-position bottom
set -g renumber-windows on
